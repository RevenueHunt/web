<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="t1"><title id="t1">Homepage with quiz CTA and a 10% off discount badge teasing the reward before the customer enters the quiz</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="20" y="20" width="280" height="140" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="20" width="280" height="18" rx="6" fill="#16161D"/>
  <circle cx="30" cy="29" r="2.5" fill="#fff" opacity="0.5"/>
  <rect x="220" y="26" width="32" height="6" rx="1" fill="#fff" opacity="0.4"/>
  <rect x="258" y="26" width="32" height="6" rx="1" fill="#fff" opacity="0.4"/>
  <rect x="40" y="56" width="180" height="10" rx="2" fill="#cbd5e1"/>
  <rect x="40" y="74" width="140" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="40" y="86" width="160" height="6" rx="2" fill="#e2e8f0"/>
  <rect x="40" y="110" width="130" height="34" rx="6" fill="#16161D"/>
  <text x="105" y="132" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.5">TAKE THE QUIZ</text>
  <g transform="translate(160,100)">
    <circle r="22" fill="#fbbf24" stroke="#fff" stroke-width="3"/>
    <text y="-2" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#16161D" text-anchor="middle">10%</text>
    <text y="9" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#16161D" text-anchor="middle" letter-spacing="0.4">OFF</text>
  </g>
  <rect x="235" y="56" width="50" height="42" rx="3" fill="#f1f5f9"/>
  <rect x="235" y="106" width="50" height="42" rx="3" fill="#f1f5f9"/>
</svg>
