<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="t4"><title id="t4">Three tiered discount thresholds at 10%, 15% and 20% off with a progress indicator and toast notification prompting the customer to add more to unlock the next tier</title>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="20" y="20" width="280" height="36" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="34" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.6">CART VALUE</text>
  <text x="34" y="49" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#16161D">£62</text>
  <text x="286" y="42" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#16a34a" text-anchor="end">Spend £18 more for 15% off</text>
  <rect x="20" y="68" width="280" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="20" y="68" width="155" height="8" rx="4" fill="#16a34a"/>
  <g font-family="Arial, sans-serif">
    <circle cx="60" cy="72" r="6" fill="#16a34a" stroke="#fff" stroke-width="2"/>
    <text x="60" y="96" font-size="10" font-weight="800" fill="#16161D" text-anchor="middle">10%</text>
    <text x="60" y="108" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">£40+</text>
    <circle cx="175" cy="72" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="175" y="96" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle">15%</text>
    <text x="175" y="108" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">£80+</text>
    <circle cx="290" cy="72" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="290" y="96" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle">20%</text>
    <text x="290" y="108" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">£120+</text>
  </g>
  <g transform="translate(40,120)">
    <rect x="0" y="0" width="240" height="44" rx="6" fill="#16161D"/>
    <circle cx="22" cy="22" r="11" fill="#16a34a"/>
    <text x="22" y="26" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">!</text>
    <text x="44" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">10% OFF UNLOCKED</text>
    <text x="44" y="33" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1">Add £18 more to unlock 15% off</text>
  </g>
</svg>
